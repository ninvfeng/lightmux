org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# 用比 AGP 更新的 lint 跑检查（构建本身仍是 AGP 8.7.2）。
#
# 起因：androidx 从 lifecycle 2.9 / compose 1.8 起，lint.jar 换成了新的 Kotlin Analysis API。
# AGP 8.7.2 内置的 lint 加载不了，报 ObsoleteLintCustomCheck 后**整包跳过**——
# 也就是说 compose 自带的那套检查（remember 误用、组合里起协程、Modifier 顺序、
# 非可观察地读 locale……）在本项目从来一次都没跑过，安静了一年多。
# 开这行之后立刻抓到一个真问题（FilesScreen 的 locale 兜底，已修）。
#
# 这个开关只换 lint 的版本，不动 AGP、compileSdk、build-tools，
# 所以不需要像升 AGP 那样连 CI 镜像一起重做（AGP 8.8+ 要 compileSdk 36）。
# 首次构建要联网拉一次 lint-gradle:31.13.2（约 30MB，之后进 gradle 缓存，--offline 照常）。
android.experimental.lint.version = 8.13.2
