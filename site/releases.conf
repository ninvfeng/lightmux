# 1Panel 站点 lightmux.lighttools.net 的反向代理「releases」（网站 → 反向代理 → 源文）的存档，改了要同步回面板。
# CNB 的发布列表不给跨域，同源转发给落地页取最新版本号和 APK 直链；同一地址按 Accept 回 JSON。
location = /releases.json {
    proxy_pass https://cnb.cool/ninvfeng/lighttools/lightmux/-/releases?page=1&page_size=5;
    proxy_set_header Host cnb.cool;
    proxy_set_header Accept application/vnd.cnb.web+json;
    proxy_set_header Cookie "";
    proxy_hide_header Set-Cookie;
    proxy_ssl_server_name on;
    proxy_ssl_name cnb.cool;
    add_header Cache-Control "public, max-age=300";
}
